# Local development only. Credentials below are throwaway dev values.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shajara
      POSTGRES_PASSWORD: shajara_dev
      POSTGRES_DB: shajara
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shajara"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  redis:
    image: redis:7
    profiles: ["redis"]
    ports: ["6379:6379"]
volumes:
  pgdata:
  miniodata:
